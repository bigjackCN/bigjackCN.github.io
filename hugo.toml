baseURL = 'https://bigjackCN.github.io/'
languageCode = 'en-us'
title = '黄人日记'
theme = 'PaperMod'

[params]
  defaultTheme = 'light'
  author = 'big jack'
  copyright = '© 2026 big jack'
  description = 'Software engineer. Projects, notes and progress.'
  mainSections = ['posts']
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true

  # Home page: a short profile with buttons, no post list
  [params.profileMode]
    enabled = true
    title = '黄人日记'
    subtitle = 'Software engineer. Java, backend and testing. What I build, what I learn, what I think.'

    [[params.profileMode.buttons]]
      name = 'Projects'
      url = '/projects/'
    [[params.profileMode.buttons]]
      name = 'Blog'
      url = '/posts/'
    [[params.profileMode.buttons]]
      name = 'About'
      url = '/about/'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/bigjackCN'
  # [[params.socialIcons]]
  #   name = 'linkedin'
  #   url = 'https://www.linkedin.com/in/your-handle/'
  # [[params.socialIcons]]
  #   name = 'email'
  #   url = 'mailto:you@example.com'

[taxonomies]
  tag = 'tags'

