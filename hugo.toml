baseURL = 'https://bigjackCN.github.io/'
languageCode = 'en-us'
title = '黄人日记'
theme = 'PaperMod'

[params]
  defaultTheme = 'light'
  author = 'big jack'
  copyright = '© 2026 big jack'
  description = 'Software engineer in Toronto. Backend and full-stack work, notes on Java and system design.'
  mainSections = ['posts']
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true

  # Home page: a short profile with buttons, no post list
  [params.profileMode]
    enabled = true
    title = "Hi, I'm big jack"
    subtitle = 'Software engineer in Toronto. Java and Spring Boot backends, plus what I build, learn and think.'

    [[params.profileMode.buttons]]
      name = 'Projects'
      url = '/projects/'
    [[params.profileMode.buttons]]
      name = 'Blog'
      url = '/posts/'
    [[params.profileMode.buttons]]
      name = 'Tags'
      url = '/tags/'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/bigjackCN'

[taxonomies]
  tag = 'tags'

[[menu.main]]
  name = 'Projects'
  url = '/projects/'
  weight = 10

[[menu.main]]
  name = 'Blog'
  url = '/posts/'
  weight = 20

[[menu.main]]
  name = 'Tags'
  url = '/tags/'
  weight = 30

# External: PaperMod adds the little outbound arrow for any URL containing "://"
[[menu.main]]
  name = 'GitHub'
  url = 'https://github.com/bigjackCN'
  weight = 40
